# The sheep's server. `npm run sheep-api:dev` (from the root) runs it on this machine with a local D1; nothing here is
# deployed until step 5 of `src/games/sheep/PLAN.md`. Secrets are not here: in `.dev.vars` locally (see
# `.dev.vars.example`), in Cloudflare's settings when live.
name = "sheep-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
send_metrics = false

# Keep the worker's logs (errors, and what the checkout and the webhook refused) in Cloudflare's dashboard, so that a
# payment with no sheep can be looked into afterwards.
[observability]
enabled = true

[vars]
ORIGINS = "https://tiagojeronimo.github.io"
SITE = "https://tiagojeronimo.github.io"
# The owner's page, /admin, behind Cloudflare Access, needs ACCESS_TEAM (the team's name, <team>.cloudflareaccess.com),
# ACCESS_AUD (the Access application's audience tag) and ADMIN_EMAILS (who may in, comma-separated). They are set as
# secrets (`wrangler secret put ...`) and not here: a deploy would wipe values set in the dashboard by these, and the
# owner's email has no business in a public repo. Until they are set, /admin refuses everybody.
# Never put ADMIN_DEV_BYPASS here or in Cloudflare: it belongs in .dev.vars only.

[[d1_databases]]
binding = "DB"
database_name = "sheep"
# Made by the owner with `wrangler d1 create sheep` at step 5; locally any value does.
database_id = "164b03c7-8b78-40a4-a2c3-4b34366f1fb3"
migrations_dir = "migrations"

# At most ten checkouts a minute from one address: /checkout makes a payment at Stripe every time it is asked.
[[ratelimits]]
name = "CHECKOUT_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 10
  period = 60
